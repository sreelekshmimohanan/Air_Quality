{% load static %}
{% block content %}
{% include 'header.html' %}

<br>

  <section id="contact" class="tm-section-pad-top tm-parallax-2">
    
      <div class="container tm-container-contact">
        
        <div class="row">
            
            <div class="text-center col-12">
                <h2 class="tm-section-title mb-4">Contact Us</h2>
               <br>
            </div>
            
            <div class="col-sm-12 col-md-6">
                <center>
              <form action="addreg" method="POST">
                {% csrf_token %}
                <input id="name" name="name" type="text" placeholder="Your Name" class="tm-input" required />
                <input id="email" name="email" type="email" placeholder="Your Email" class="tm-input" required />
                <input id="subject" name="phone" type="text" placeholder="Enter Your Phone Number" class="tm-input" required />
                <input id="message" name="password" rows="5" placeholder="Your Password" class="tm-input" required>


                {% if message %}
                <div class="alert alert-success">{{ message }}</div>
                {% endif %}
                <button type="submit" class="btn tm-btn-submit">Submit</button>
              </form></center>
            </div>
            
            <div class="col-sm-12 col-md-6">

                
               
                
              
                
               
                
                <div class="contact-item">&nbsp;</div>
            
            </div>
            
            
        </div><!-- row ending -->
        
      </div>



{% include 'footer.html' %}
    {% endblock %}
